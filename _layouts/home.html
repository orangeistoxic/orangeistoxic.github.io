---
layout: default
---

<main id="main" class="post-index" role="main">
  {{ content }}

  {% if paginator %}
    {% assign posts = paginator.posts %}
  {% else %}
    {% assign posts = site.posts %}
  {% endif %}

  <div class="post-grid">
    {% for post in posts %}
      {% include post-card.html post=post %}
    {% endfor %}
  </div>

  {% include paginator.html %}
</main>
